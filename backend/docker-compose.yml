name: booking_cv

services:
  postgres:
    image: postgres:16-alpine
    container_name: booking_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: booking_cv
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  # Local mail catcher: SMTP on 1025, inbox UI + REST API on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: booking_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
